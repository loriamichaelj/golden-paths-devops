# Plans one app in one environment and saves the plan. tofu-apply applies exactly this plan.
spec:
  inputs:
    stage:
      default: plan
    app:
      description: App name; used in job names and artifact folders
    env:
      options: [dev, stage, uat, prod]
    root_dir:
      description: The app's OpenTofu root module, with envs/<env>.tfvars and envs/<env>.backend.hcl
    changes:
      default: "**/*"
    branches:
      default: any
      options: [any, default]
      description: default runs only on the default branch, for roles that trust only the protected default branch

    cloud:
      options: [aws, azure]
    role:
      description: AWS role ARN or Azure client ID that trusts this job. Not a secret.
    azure_tenant:
      default: ""
    azure_subscription:
      default: ""
    image:
      default: ghcr.io/opentofu/opentofu:1.11   # pin by digest
---
"gp-tofu-plan-$[[ inputs.app ]]-$[[ inputs.env ]]":
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.image ]]
    entrypoint: [""]
  id_tokens:
    OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    OUT: $CI_PROJECT_DIR/gp-artifacts/tofu-plan-$[[ inputs.app ]]-$[[ inputs.env ]]
    GP_BRANCHES: $[[ inputs.branches ]]
  before_script:
    - |
      case "$[[ inputs.cloud ]]" in
        aws)
          GP_TOKEN_FILE=$(mktemp) && printf '%s' "$OIDC_TOKEN" > "$GP_TOKEN_FILE"
          export AWS_WEB_IDENTITY_TOKEN_FILE="$GP_TOKEN_FILE" AWS_ROLE_ARN="$[[ inputs.role ]]" AWS_ROLE_SESSION_NAME="gp-$CI_JOB_ID"
          ;;
        azure)
          export ARM_USE_OIDC=true ARM_OIDC_TOKEN="$OIDC_TOKEN" ARM_CLIENT_ID="$[[ inputs.role ]]" \
            ARM_TENANT_ID="$[[ inputs.azure_tenant ]]" ARM_SUBSCRIPTION_ID="$[[ inputs.azure_subscription ]]"
          ;;
        *)
          echo "gp: cloud '$[[ inputs.cloud ]]' isn't supported yet" >&2; exit 1
          ;;
      esac
  script:
    - mkdir -p "$OUT"
    - cd "$[[ inputs.root_dir ]]"
    - tofu fmt -check -recursive
    - tofu init -input=false -backend-config="envs/$[[ inputs.env ]].backend.hcl"
    - tofu validate
    - tofu plan -input=false -lock-timeout=5m -var-file="envs/$[[ inputs.env ]].tfvars" -out="$OUT/plan.tfplan"
    - tofu show -json "$OUT/plan.tfplan" > "$OUT/plan.json"
  artifacts:
    access: developer   # plans can hold secret values
    expire_in: 7 days
    paths:
      - gp-artifacts/tofu-plan-$[[ inputs.app ]]-$[[ inputs.env ]]/
  rules:
    - if: $GP_BRANCHES == "default" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - changes: ["$[[ inputs.changes ]]"]
