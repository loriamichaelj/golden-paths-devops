# Every artifact a component produces. A component that adds an artifact adds it here in the same MR.
# retention is GitLab expire_in; access is GitLab artifacts:access (all or developer).
# artifact-record hashes every job artifact under gp-artifacts/ into artifact-manifest.json.
artifacts:
  contract-report:
    producer: contract-validate
    files: [validate.json, explain.json]
    retention: 30 days
    access: all
    consumers: [MR reviewers, repo dashboards]
  saved-plan:
    producer: tofu-plan
    files: [plan.tfplan, plan.json]
    retention: 7 days
    access: developer
    sensitive: true   # can hold secret values; encrypted by OpenTofu plan encryption
    consumers: [tofu-apply, policy-check, cost-estimate]
  apply-log:
    producer: tofu-apply
    files: [apply.log]
    retention: 1 year
    access: developer
    consumers: [audit, change records]
  scan-report:
    producer: security-scan
    files: [gl-code-quality-report.json, results.sarif]
    retention: 90 days
    access: developer   # vulnerability detail stays with project members
    consumers: [MR widget, Security & IT digest]
  policy-report:
    producer: policy-check
    files: [conftest.json]
    retention: 90 days
    access: developer
    consumers: [MR reviewers, scorecard policy pass rate]
  cost-report:
    producer: cost-estimate
    files: [infracost.json, infracost.txt]
    retention: 90 days
    access: all
    consumers: [MR reviewers, FinOps showback]
  ephemeral-env-record:
    producer: ephemeral-env
    files: [env.json, destroyed.json]
    retention: 1 year
    access: all
    consumers: [environment.destroyed event, Finance digest, scorecard create and destroy times]
  artifact-manifest:
    producer: artifact-record
    files: [artifact-manifest.json]
    retention: 1 year
    access: all
    consumers: [audit]

# Release artifacts live in registries, not job artifacts. Listed so the whole set is in one place.
releases:
  gold:
    producer: platform ci/ on gold-v* tags
    store: package-registry
    files: [gold_<os>_<arch>.tar.gz, checksums.txt, checksums.txt.sig]
    retention: permanent
  scanner-image:
    producer: platform ci/ on scanner-v* tags
    store: container-registry
    retention: permanent
  pipeline-components:
    producer: this repo on v* tags
    store: ci-cd-catalog
    retention: permanent
